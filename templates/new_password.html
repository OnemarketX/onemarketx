{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Password</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<section class="auth-wrap">

<div class="auth-card">

<h2>Create New Password</h2>

<form method="POST">
{% csrf_token %}

<input type="password"
name="password"
placeholder="New Password"
required>

<input type="password"
name="confirm"
placeholder="Confirm Password"
required>

<button type="submit">
Update Password
</button>

</form>

</div>
</section>

</body>
</html>
