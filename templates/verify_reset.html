{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Code</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<section class="auth-wrap">

<div class="auth-card">

<h2>Verify Code</h2>
<p>Check your email inbox</p>

<form method="POST">
{% csrf_token %}

<input type="text"
name="code"
placeholder="6 Digit Code"
required>

<button type="submit">
Verify Code
</button>

</form>

</div>
</section>

</body>
</html>
